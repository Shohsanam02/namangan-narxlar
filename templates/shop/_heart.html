{% if user.is_authenticated %}<form method="post" action="{% url 'toggle_favorite' product.id %}" style="display:inline;margin:0">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="heart" title="{% if product.id in favorite_ids %}Sevimlilardan olib tashlash{% else %}Sevimlilarga qo'shish{% endif %}" aria-label="{{ product.name }}: sevimli" aria-pressed="{% if product.id in favorite_ids %}true{% else %}false{% endif %}">{% if product.id in favorite_ids %}❤️{% else %}🤍{% endif %}</button></form>{% endif %}
